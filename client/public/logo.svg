<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 250" width="100%" height="100%">
  <defs>
    <!-- Primary Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Speed Motion Trails -->
    <linearGradient id="speedTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="1"/>
    </linearGradient>

    <!-- Drop Shadow for Pin -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1E3A8A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(15, 0)">
    <!-- Speed Lines (Rapid Effect) -->
    <path d="M 20 80 L 80 80" stroke="url(#speedTrail)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 10 110 L 70 110" stroke="url(#speedTrail)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 30 140 L 85 140" stroke="url(#speedTrail)" stroke-width="4" stroke-linecap="round"/>

    <!-- Map Route Pin Pinhead -->
    <path d="M 140 25 C 95 25 60 60 60 105 C 60 158 125 218 135 227 C 138 230 142 230 145 227 C 155 218 220 158 220 105 C 220 60 185 25 140 25 Z" 
          fill="url(#primaryGrad)" filter="url(#dropShadow)"/>

    <!-- Pin Inner Background Circle -->
    <circle cx="140" cy="100" r="52" fill="#FFFFFF"/>

    <!-- Dynamic Route Arc -->
    <path d="M 65 160 Q 135 215 215 150" fill="none" stroke="#06B6D4" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 6"/>
    <circle cx="215" cy="150" r="4.5" fill="#06B6D4"/>

    <!-- Bus Icon -->
    <g transform="translate(105, 68)">
      <!-- Bus Body -->
      <rect x="0" y="0" width="70" height="60" rx="12" fill="#0F172A"/>
      
      <!-- Windshield -->
      <rect x="6" y="8" width="58" height="23" rx="5" fill="#38BDF8"/>
      <!-- Windshield Reflection -->
      <path d="M 46 8 L 56 8 L 42 31 L 32 31 Z" fill="#FFFFFF" opacity="0.35"/>
      
      <!-- Headlights -->
      <circle cx="12" cy="44" r="4.5" fill="#FACC15"/>
      <circle cx="58" cy="44" r="4.5" fill="#FACC15"/>
      
      <!-- Grille -->
      <rect x="22" y="42" width="26" height="5" rx="2.5" fill="#64748B"/>
      
      <!-- Side Mirrors -->
      <rect x="-4" y="15" width="4" height="9" rx="2" fill="#0F172A"/>
      <rect x="70" y="15" width="4" height="9" rx="2" fill="#0F172A"/>

      <!-- Lower Chassis/Tires -->
      <rect x="10" y="58" width="14" height="4" rx="2" fill="#334155"/>
      <rect x="46" y="58" width="14" height="4" rx="2" fill="#334155"/>
    </g>
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(255, 0)">
    <!-- Primary Title -->
    <text x="0" y="115" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#0F172A" letter-spacing="-0.5">
      RAPID<tspan fill="#2563EB">ROUTE</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="3" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="18" fill="#64748B" letter-spacing="9">
      SYSTEM
    </text>
    
    <!-- Bottom Accent Line -->
    <rect x="3" y="168" width="305" height="4" rx="2" fill="url(#primaryGrad)"/>
    <circle cx="318" cy="170" r="3.5" fill="#06B6D4"/>
  </g>
</svg>
